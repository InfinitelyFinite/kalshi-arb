mode:
  trading_mode: "dry_run"   # Options: dry_run, sandbox, live
  data_mode: "simulation"   # Options: simulation, real

kalshi:
  base_url_prod: "https://api.elections.kalshi.com/trade-api/v2"
  base_url_sandbox: "https://demo-api.kalshi.co/trade-api/v2"
  key_id: "${KALSHI_KEY_ID}"
  private_key_path: "${KALSHI_PRIVATE_KEY_PATH}"

polymarket:
  gamma_url: "https://gamma-api.polymarket.com"
  clob_url: "https://clob.polymarket.com"

trading:
  min_edge: 0.02
  default_order_size: 10
  maker_fee_bps: 0.0
  taker_fee_bps: 0.0
  polygon_gas_estimate_cents: 0.0

risk:
  max_position_per_market: 100
  max_global_exposure: 1000.0
  max_daily_loss: 100.0

matching:
  min_similarity: 0.85
  overrides_path: "config/market_overrides.yaml"
  overrides_only: true

# Verified market pairs (config/market_overrides.yaml). Bounds are errors in strict mode, warnings otherwise.
pair_registry:
  min_verified_pairs: 10
  max_verified_pairs: 20
  min_categories: 1
  gate_interval_minutes: 30        # collection gate re-checks pair tradability this often
  close_time_mismatch_hours: 24    # warn if Kalshi/Polymarket expected close differ by more

# Order book depth stored per snapshot
depth:
  depth_levels: 10                 # top N levels per side (orderbook_levels)
  vwap_sizes: [1, 10, 50]          # contract sizes for VWAP / fillability checks
  ws_reconcile_seconds: 300        # periodic REST reconciliation of WebSocket-maintained books

# Data quality report thresholds
data_quality:
  snapshot_interval_seconds: 60
  gap_threshold_seconds: 300
  stale_quote_seconds: 60

# Step 12: Executability and liquidity analysis parameters
executability:
  sizes: [1, 10, 50]
  min_edge_cents: 2.0
  tau_fresh: 10.0
  tau_fresh_sweep: [5.0, 10.0, 30.0]
  tau_skew: 5.0
  tau_skew_sweep: [1.0, 5.0, 10.0]
  clock_tolerance_s: 2.0
  kalshi_taker_rate: 0.07
  kalshi_multiplier: 1.0
  polymarket_taker_rate: 0.0
  polygon_gas_cents: 0.0
  slippage_cents: 0.0
  latency_sweep_s: [1.0, 2.0, 5.0, 10.0, 30.0]
  episode_gap_tolerance: 1.5
